<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis XV - Matilda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Pantalla 1: sobre cerrado -->
    <div id="screen-envelope" class="screen active">
      <div class="frame-scaler" data-frame-width="1920" data-frame-height="2513">
        <div class="frame" id="envelope-frame">
          <img class="bg-fill" src="images/bg-envelope.jpg" alt="" />

          <img class="abs crown-logo" src="images/crown-logo.png" alt="" />

          <h2 class="abs eyebrow">Invitación para:</h2>
          <h1 id="guest-names-envelope" class="abs script-names">&nbsp;</h1>

          <img class="abs divider-vector" src="images/divider.png" alt="" />

          <div class="abs seal-glow" id="seal-glow"></div>

          <img
            id="envelope"
            class="abs envelope-img"
            src="images/envelope.png"
            alt="Sobre de invitación"
            tabindex="0"
            role="button"
            aria-label="Abrir invitación"
          />
          <p class="abs hint">toca para abrir</p>
        </div>
      </div>
    </div>

    <!-- Destello y pétalos de la transición entre pantallas -->
    <div class="flash-burst" id="flash-burst"></div>
    <div class="petal-layer" id="petal-layer"></div>

    <!-- Pantalla 2: invitación con detalles del evento -->
    <!-- PENDIENTE: seguir armando debajo de la bajada (fecha/hora/lugar, mapa,
         dresscode, cuenta regresiva, RSVP) en cuanto lleguen esas imágenes -->
    <div id="screen-invitation" class="screen hidden">
      <!-- Las "puntas" de encaje quedan fijas en pantalla mientras el resto scrollea -->
      <div
        class="frame-scaler frame-scaler--fixed"
        id="lace-scaler"
        data-frame-width="1920"
        data-frame-height="560"
        data-align-top="315"
      >
        <div class="frame" id="lace-frame">
          <img class="abs lace-fixed" src="images/screen2-lace-fixed.png" alt="" />
        </div>
      </div>

      <div class="frame-scaler" id="invitation-scaler" data-frame-width="1920" data-frame-height="2830">
        <div class="frame" id="invitation-frame">
          <img class="bg-fill" src="images/screen2-bg.jpg" alt="" />

          <img class="abs s2-ribbon" src="images/screen2-ribbon.png" alt="" />
          <img class="abs s2-flower" src="images/screen2-flower.png" alt="" />

          <div class="abs s2-card">
            <img class="s2-card-bg" src="images/screen2-card.jpg" alt="" />

            <p class="abs s2-quote">
              Hay momentos que merecen<br />convertirse en recuerdos.
              <br /><em>Queremos que seas parte de uno de ellos.</em>
            </p>

            <img class="abs s2-divider-1" src="images/screen2-divider-1.png" alt="" />

            <img class="abs s2-logo" src="images/screen2-logo.png" alt="Matilda mis XV" />

            <img class="abs s2-photo" src="images/screen2-photo.gif" alt="Matilda" />

            <h2 id="guest-names-invitation" class="abs s2-names">&nbsp;</h2>

            <img class="abs s2-divider-2" src="images/screen2-divider-2.png" alt="" />

            <p class="abs s2-callout">
              Estás invitado a celebrar<br />los XV años de <span id="celebrant-name">Matilda</span>.
            </p>

            <img class="abs s2-divider-3" src="images/screen2-divider-3.png" alt="" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/guests.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
