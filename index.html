<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis XV - Matilda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Pantalla 1: sobre cerrado -->
    <div id="screen-envelope" class="screen active">
      <div class="frame-scaler" data-frame-width="1920" data-frame-height="2513">
        <div class="frame" id="envelope-frame">
          <img class="bg-fill" src="images/bg-envelope.jpg" alt="" />

          <img class="abs crown-logo" src="images/crown-logo.png" alt="" />

          <h2 class="abs eyebrow">Invitación para:</h2>
          <h1 id="guest-names-envelope" class="abs script-names">&nbsp;</h1>

          <img class="abs divider-vector" src="images/divider.png" alt="" />

          <img
            id="envelope"
            class="abs envelope-img"
            src="images/envelope.png"
            alt="Sobre de invitación"
            tabindex="0"
            role="button"
            aria-label="Abrir invitación"
          />
          <p class="abs hint">toca para abrir</p>
        </div>
      </div>
    </div>

    <!-- Pantalla 2: invitación con detalles del evento -->
    <!-- PENDIENTE: reconstruir pixel-perfect en cuanto lleguen las imágenes del diseño de Figma -->
    <div id="screen-invitation" class="screen hidden">
      <div class="screen-invitation-inner">
        <div class="card">
          <p class="quote">Hay momentos que merecen<br />convertirse en recuerdos.</p>
          <p class="quote-italic">Queremos que seas parte de uno de ellos.</p>

          <div class="logo">
            <span class="logo-script">Matilda</span>
            <span class="logo-sub">mis <strong>XV</strong></span>
          </div>

          <div class="photo-frame">
            <img id="event-photo" src="" alt="Matilda" />
          </div>

          <h2 id="guest-names-invitation" class="invitation-names">&nbsp;</h2>

          <div class="divider"><span></span><i>&#10086;</i><span></span></div>

          <p class="callout">
            Estás invitado a celebrar<br />los XV años de <span id="celebrant-name">Matilda</span>.
          </p>

          <div class="divider"><span></span><i>&#10086;</i><span></span></div>

          <div class="event-details">
            <p><strong>Fecha:</strong> <span id="event-date"></span></p>
            <p><strong>Hora:</strong> <span id="event-time"></span></p>
            <p><strong>Lugar:</strong> <span id="event-venue-name"></span></p>
            <p class="venue-address"><span id="event-venue-address"></span></p>
            <p><strong>Código de vestimenta:</strong> <span id="event-dress-code"></span></p>
          </div>

          <a id="rsvp-link" class="rsvp-button" href="#" target="_blank" rel="noopener">
            Confirmar asistencia
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/guests.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
